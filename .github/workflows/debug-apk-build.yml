name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Target ABI
        required: false
        type: choice
        options:
          - universal
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
        default: universal

permissions:
  contents: read

jobs:
  debug-build:
    name: Build fullDebug APK (${{ inputs.abi }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config (debug keystore)
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload debug APK (${{ inputs.abi }})
        uses: actions/upload-artifact@v7
        with:
          name: nuviotv-full-debug-${{ inputs.abi }}
          path: app/build/outputs/apk/full/debug/app-full-${{ inputs.abi }}-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
